<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art&Technology</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        canvas {
            border: 1px solid black;
        }

        #btn {
            width: 300px;
            background-color: #fcfcfc;
            color: #676767;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            transition: background-color 0.2s ease-in,
                color 0.2s ease-in;
        }

        #btn:hover {
            background-color: #676767;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            transition: background-color 0.2s ease-in,
                color 0.2s ease-in;
        }
    </style>
</head>

<body>
    <div>
        <script>
            let creditY;


            function setup() {
                createCanvas(windowWidth, windowHeight);
                textAlign(CENTER, TOP);
                creditY = height; // 화면 아래에서 시작
            }

            function draw() {
                background(0);
                fill(255);
                textSize(24);
                let spacing = 40;

                let credits = [
                    "<제작 및 역할 분담>",
                    "",
                    "장한결 : ml5.js 활용 인터랙션, 병합, 연출, scene3, 4",
                    "채시우 : scene 5, 6",
                    "허진 : 연출, 스토리보드, scene1, 2",
                    "",
                    "",
                    " <제작자 소감>",
                    "",
                    "장한결 : ml5.js는 처음 사용해보아 생성형 AI인 Claude의 도움을 많이 받았습니다",
                    "팀으로 제작하는 것이다 보니 어려운 상황도 있었지만",
                    "결과물을 도출했다는 것에 만족합니다.",
                    "",
                    "채시우 : 먼저 팀원들과 같이 기획하고 작업하여 작품을 완성시킬 수 있어서 뿌듯했습니다.",
                    "또한 이러한 프로젝트를 통해 작품을 구상 및 기획하고",
                    "다른 사람들과 같이 개발해 보는 기회를 얻게 되어",
                    "너무 소중한 하나의 경험을 쌓았습니다.",
                    "",
                    "허진 : 제 머릿속에 있는 장면을 실제로 구현 과정에서 많은 어려움이 있었습니다.",
                    "하지만 부족한 부분은 AI 도구를 활용하여 보완하였고,",
                    "단순히 AI가 짜준 코드를 그대로 사용하는 것이 아니라,",
                    " 그 코드를 이해하고 필요한 부분을 직접 수정하는 과정을 통해",
                    "자연스럽게 학습이 되었던 것 같습니다.",
                    "제가 상상했던 것만큼 높은 퀄리티로 만들지는 못했지만,",
                    " 그래도 어느 정도 제가 그리고자 했던 장면이 구현된 것 같아 뿌듯합니다.",
                    "",
                    "",
                    "<AI 제작 콘텐츠>",
                    "",
                    "<AI 사용 부분>",
                    "<scene1>",
                    "- 전체 침실화면과 몸무게재는 화면 합칠 때 사용",
                    "- 자막 넣을때 사용",
                    "- 꼬르륵소리 삽입할때 오류가 생겨 ai 사용",
                    "- 체중계 숫자 증가하는 모습 구현할 때 사용",
                    "",
                    "<scene2>",
                    "- 부엌으로 걸어가는 장면 묘사하는 줌인부분에서 사용",
                    "- 두 장면 연결할 때 사용",
                    "- 냄비에 물 채울때 물의 투명도 조절하는 부분에 사용",
                    "- 물을 표현하는 원이 커지도록 하는 부분 사용",
                    "",
                    "<scene3>",
                    "AI 사용 없음",
                    "",
                    "<scene4>",
                    "tearInterRaction 함수, ramenBag 클래스 생성",
                    "비디오를 640*480 영역에만 인터랙션 할 수 있게 수정",
                    "",
                    "<scene5>",
                    "drawRamenNoodles() : 라면의 면발 그릴때,",
                    "drawSteam() : 김 올라오는 입자 표현",
                    "drawLifteddNoodle() : 라면 먹을 때 면이 꼬불꼬불하게 움직이는 애니메이션",
                    "",
                    "<scene6>",
                    "drawSecondScene() : 함수 내에서 저울의 무게가 올라가는 장면",
                    "",
                    "",
                    "감사합니다!",
                ];

                for (let i = 0; i < credits.length; i++) {
                    text(credits[i], width / 2, creditY + i * spacing);
                }

                creditY -= 1.6; // 자연스럽게 위로 올라가는 속도
            }

            function windowResized() {
                resizeCanvas(windowWidth, windowHeight);
            }
        </script>
    </div>
</body>

</html>
