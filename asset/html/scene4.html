<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art&Technology</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        canvas {
            border: 1px solid black;
        }

        #btn {
            width: 300px;
            background-color: #fcfcfc;
            color: #676767;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            transition: background-color 0.2s ease-in,
                color 0.2s ease-in;
        }

        #btn:hover {
            background-color: #676767;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            transition: background-color 0.2s ease-in,
                color 0.2s ease-in;
        }
    </style>
</head>

<body>
    <div>
        <script>
            let nextBtnCreated = false;
            let timeCheckCalled = false;
            let mouseInteractMode = false;
            let startTime;
            let runningTime;


            let handpose;
            let video;
            let predictions = [];

            let ramenBag;
            let isTorn = false;
            let tearPointX = -1;
            let tearProgress = 0;
            const MAX_TEAR_OPENING = 60;
            const TEAR_COLOR = [100, 100, 100];

            let isPinching = false;
            let pinchStartX = -1;
            let pinchStartY = -1;
            const PINCH_THRESHOLD = 35;
            const TEAR_MOVEMENT_THRESHOLD = 20;

            let fingerTipSize = 15;

            const baseWidth = 640;
            const baseHeight = 480;
            let scaleFactor = 1;

            function setup() {
                startTime = millis();
                createCanvas(windowWidth, windowHeight);
                video = createCapture(VIDEO);
                video.size(baseWidth, baseHeight);
                video.hide();

                ramenBag = new RamenBag(baseWidth / 2, baseHeight / 2, 200, 300);
                handpose = ml5.handpose(video, modelReady);
                handpose.on('predict', results => {
                    predictions = results;
                });

                scaleFactor = min(width / baseWidth, height / baseHeight);
            }

            function windowResized() {
                resizeCanvas(windowWidth, windowHeight);
                scaleFactor = min(width / baseWidth, height / baseHeight);
            }

            function modelReady() {
                console.log('Handpose Model Loaded!');
            }
            function timeCheck() {
                if (!timeCheckCalled) {
                    if (runningTime > 15000) {
                        if (confirm('카메라 인터랙션에 어려움을 겪고 계신가요?')) {
                            alert('마우스 인터랙션 모드로 전환합니다');
                            mouseInteractMode = true;
                            timeCheckCalled = true;
                        }
                        else {
                            alert('카메라 인터랙션 모드를 유지합니다');
                            timeCheckCalled = true;
                        }
                    }
                }

            }
            function mousePressed() {
                if (mouseInteractMode && !isTorn) {
                    // 마우스 좌표를 640x480 기준으로 변환
                    let scaledMouseX = (mouseX - (width - baseWidth * scaleFactor) / 2) / scaleFactor;
                    let scaledMouseY = (mouseY - (height - baseHeight * scaleFactor) / 2) / scaleFactor;

                    // 라면 봉지 위에서만 동작
                    if (ramenBag.isOver(scaledMouseX, scaledMouseY)) {
                        isTorn = true;
                        // 핀치와 동일하게 tearPointX 계산
                        tearPointX = scaledMouseX - (ramenBag.x - ramenBag.w / 2);
                        tearPointX = constrain(tearPointX, ramenBag.w * 0.1, ramenBag.w * 0.9);
                        // tearProgress도 핀치처럼 작게 (예: 20)
                        tearProgress = 10;
                        isPinching = false;
                    }
                }
            }



            function draw() {
                runningTime = millis() - startTime;
                timeCheck();
                background("#d2b48c");

                // 1. 중앙 정렬 및 확대
                push();
                translate(
                    (width - baseWidth * scaleFactor) / 2,
                    (height - baseHeight * scaleFactor) / 2
                );
                scale(scaleFactor);

                // 2. 640x480 영역에만 모든 오브젝트/인터랙션
                ramenBag.display();

                if (predictions.length > 0) {
                    const hand = predictions[0];
                    const thumb = hand.landmarks[4];
                    const indexFinger = hand.landmarks[8];

                    // 비디오 좌표를 640x480에 매핑
                    let thumbX = map(thumb[0], 0, video.width, 0, baseWidth);
                    let thumbY = map(thumb[1], 0, video.height, 0, baseHeight);
                    let indexX = map(indexFinger[0], 0, video.width, 0, baseWidth);
                    let indexY = map(indexFinger[1], 0, video.height, 0, baseHeight);

                    // 미러링
                    thumbX = baseWidth - thumbX;
                    indexX = baseWidth - indexX;

                    fill(0, 255, 0, 150);
                    noStroke();
                    ellipse(thumbX, thumbY, fingerTipSize, fingerTipSize);
                    fill(0, 0, 255, 150);
                    ellipse(indexX, indexY, fingerTipSize, fingerTipSize);

                    if (!isTorn) {
                        checkTearInteraction(thumbX, thumbY, indexX, indexY);
                    }
                } else {
                    isPinching = false;
                }
                pop();

                // 3. 안내 텍스트는 전체화면 기준
                fill(0);
                textAlign(CENTER, TOP);
                textSize(16 * scaleFactor);
                if (!mouseInteractMode) {
                    text(
                        "손가락을 라면 봉지 위에 올리고,\n엄지와 검지를 맞닿아 핀치한 후 상하로 움직여 뜯어보세요.",
                        width / 2,
                        20 * scaleFactor
                    );
                }
                else {
                    text(
                        "마우스 커서를 라면 봉지 위에 올리고,\n클릭하여 뜯어보세요.",
                        width / 2,
                        20 * scaleFactor
                    );
                }

                if (isTorn) {
                    text("봉지를 뜯었습니다!", width / 2, height - 40 * scaleFactor);
                    skipToNextScene();
                }
            }

            function checkTearInteraction(thumbX, thumbY, indexX, indexY) {
                let pinchCenterX = (thumbX + indexX) / 2;
                let pinchCenterY = (thumbY + indexY) / 2;
                let distance = dist(thumbX, thumbY, indexX, indexY);

                if (distance < PINCH_THRESHOLD) {
                    if (ramenBag.isOver(pinchCenterX, pinchCenterY)) {
                        if (!isPinching) {
                            isPinching = true;
                            pinchStartX = pinchCenterX;
                            pinchStartY = pinchCenterY;
                            fill(255, 0, 0);
                            ellipse(pinchCenterX, pinchCenterY, fingerTipSize * 1.5, fingerTipSize * 1.5);
                        } else {
                            let movementY = pinchCenterY - pinchStartY;
                            fill(255, 165, 0);
                            ellipse(pinchCenterX, pinchCenterY, fingerTipSize * 1.5, fingerTipSize * 1.5);

                            if (abs(movementY) > TEAR_MOVEMENT_THRESHOLD) {
                                isTorn = true;
                                tearPointX = pinchCenterX - (ramenBag.x - ramenBag.w / 2);
                                tearPointX = constrain(tearPointX, ramenBag.w * 0.1, ramenBag.w * 0.9);
                                tearProgress = min(tearProgress + abs(movementY) * 0.1, MAX_TEAR_OPENING);
                                isPinching = false;
                            }
                        }
                    } else {
                        isPinching = false;
                    }
                } else {
                    isPinching = false;
                }
            }

            class RamenBag {
                constructor(x, y, w, h) {
                    this.x = x; this.y = y; this.w = w; this.h = h;
                    this.color = color(255, 80, 80);
                    this.labelColor = color(255);
                    this.brandColor = color(255, 255, 0);
                }
                isOver(px, py) {
                    return px > this.x - this.w / 2 && px < this.x + this.w / 2 &&
                        py > this.y - this.h / 2 && py < this.y + this.h / 2;
                }
                display() {
                    push();
                    translate(this.x, this.y);
                    if (!isTorn) {
                        fill(this.color); noStroke(); rectMode(CENTER);
                        rect(0, 0, this.w, this.h, 10);
                        fill(this.brandColor); ellipse(0, -this.h * 0.25, this.w * 0.6, this.h * 0.2);
                        textAlign(CENTER, CENTER); textSize(this.w / 5); fill(0);
                        text("라면", 0, -this.h * 0.25);
                        textSize(this.w / 15); fill(this.labelColor);
                        text("맛있는 라면", 0, this.h * 0.1);
                        text("Net Wt. 120g", 0, this.h * 0.25);
                    } else {
                        rectMode(CORNER);
                        let bagOriginX = -this.w / 2; let bagOriginY = -this.h / 2;
                        let currentTearX = bagOriginX + tearPointX;
                        let opening = tearProgress / 2;
                        fill(this.color); noStroke();
                        // 왼쪽 부분
                        beginShape();
                        vertex(bagOriginX, bagOriginY); vertex(currentTearX - opening, bagOriginY);
                        for (let y_ = bagOriginY; y_ <= bagOriginY + this.h; y_ += 10) vertex(currentTearX - opening + random(-5, 2), y_);
                        vertex(currentTearX - opening, bagOriginY + this.h); vertex(bagOriginX, bagOriginY + this.h);
                        endShape(CLOSE);
                        // 오른쪽 부분
                        beginShape();
                        vertex(currentTearX + opening, bagOriginY); vertex(bagOriginX + this.w, bagOriginY);
                        vertex(bagOriginX + this.w, bagOriginY + this.h); vertex(currentTearX + opening, bagOriginY + this.h);
                        for (let y_ = bagOriginY + this.h; y_ >= bagOriginY; y_ -= 10) vertex(currentTearX + opening + random(-2, 5), y_);
                        endShape(CLOSE);
                        // 찢어진 단면
                        fill(TEAR_COLOR); beginShape();
                        for (let y_ = bagOriginY; y_ <= bagOriginY + this.h; y_ += 8) vertex(currentTearX - opening + random(-4, 1), y_);
                        for (let y_ = bagOriginY + this.h; y_ >= bagOriginY; y_ -= 8) vertex(currentTearX + opening + random(-1, 4), y_);
                        endShape(CLOSE);
                        // 찢어진 후 로고 표시 (부분적으로 보일 수 있음)
                        fill(this.brandColor); ellipse(0, -this.h * 0.25, this.w * 0.6, this.h * 0.2);
                        textAlign(CENTER, CENTER); textSize(this.w / 5); fill(0);
                        if (currentTearX - opening > bagOriginX + this.w * 0.3) text("라", -this.w * 0.15, -this.h * 0.25);
                        if (currentTearX + opening < bagOriginX + this.w * 0.7) text("면", this.w * 0.15, -this.h * 0.25);
                    }
                    pop();
                }
            }

            function skipToNextScene() {
                if (!nextBtnCreated) {
                    let btn = createButton('다음 장면으로 넘어가려면 클릭하세요');
                    btn.position(width - 320, height - 80);
                    btn.id('btn');
                    btn.mousePressed(() => {
                        location.href = ("/p5js/asset/html/scene5.html");
                    });
                    nextBtnCreated = true; // 버튼 생성 플래그
                }
            }
        </script>
    </div>
</body>

</html>
