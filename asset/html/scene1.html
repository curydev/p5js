<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art&Technology</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.7/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.7/lib/addons/p5.sound.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        canvas {
            border: 1px solid black;
        }

        #btn {
            width: 300px;
            background-color: #ffffff;
            color: #212529;
            border-style: solid;
            border-color: #212529;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            transition: background-color 0.2s ease-in,
                color 0.2s ease-in;
        }

        #btn:hover {
            background-color: #212529;
            color: #ffffff;
            border: solid;
            border-color: #212529;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            transition: background-color 0.2s ease-in,
                color 0.2s ease-in;
        }
    </style>
</head>

<body>
    <div>
        <script>
            let startTime;
            let phase = 0;
            let currentWeight = 0;
            let scene = 0;
            let ggorurukSound;
            let soundPlayed = false;

            let img1, img2;

            function preload() {
                soundFormats('mp3');
                ggorurukSound = loadSound("/p5js/asset/sound/hungry.mp3");
                img1 = loadImage("/p5js/asset/image/footL.png");
                img2 = loadImage("/p5js/asset/image/footR.png");
            }

            function setup() {
                createCanvas(windowWidth, windowHeight);
                startTime = millis();
                textFont("Arial");

                // 브라우저에서 오디오 재생 허용
                userStartAudio();
            }

            function draw() {
                if (scene === 0) {
                    background(245, 235, 220); // 베이지 배경
                    drawFirstScene();

                    let t = millis() - startTime;
                    if (t > 2000 && !soundPlayed) {
                        ggorurukSound.play(); // 꼬르륵 소리 재생
                        soundPlayed = true;
                    }
                    if (t > 4000) {
                        drawButton("몸무게 재러가기", width - 250, height - 80, 200, 50);
                    }
                } else if (scene === 1) {
                    background(160, 110, 80); // 체중계 배경
                    drawSecondScene();
                }
            }

            function drawFirstScene() {
                fill(120, 90, 60); // 바닥
                quad(80, windowHeight * 5 / 7, windowWidth, windowHeight * 5 / 7, windowWidth, windowHeight, 0, windowHeight);
                strokeWeight(4);
                stroke(100, 50, 20);
                line(80, windowHeight * 5 / 7, 80, 0);  //
                drawBackground(0, 0, 2.5);
                line(80, windowHeight * 5 / 7, 80, 0);  //

                drawClock(windowWidth * 3 / 10, windowHeight / 5, 250);

                let t = millis() - startTime;

                if (t > 1000 && t < 3000) {
                    drawSubtitle("나 : 벌써 새벽 2시네...?");
                }

                if (t > 4000) {
                    drawSubtitle("나 : 너무 배고프다....");
                }
            }

            function drawSecondScene() {
                drawFloor();
                let t = millis() - startTime;

                if (t < 1000) {
                    drawScale(windowWidth / 3, windowHeight / 4, 3, false, true, 0);
                } else if (t < 2000) {
                    drawScale(windowWidth / 3, windowHeight / 4, 3, true, true, 0);
                } else if (t < 5000) {
                    let progress = constrain((t - 2000) / 5000, 0, 1);
                    currentWeight = floor(progress * 11) * 15;
                    if (currentWeight > 55) currentWeight = 55;
                    drawScale(windowWidth / 3, windowHeight / 4, 3, true, true, currentWeight);
                } else {
                    drawScale(windowWidth / 3, windowHeight / 4, 3, true, true, 55);
                    if (t < 7000) {
                        drawSubtitle("나 : 흠... 55키로...?");
                    } else if (t < 9000) {
                        drawSubtitle("나 : 라면 먹어도 되겠는걸!");
                        skipToNextScene();
                    }
                }
            }

            function drawButton(label, x, y, w, h) {
                fill(50);
                stroke(255);
                strokeWeight(2);
                rect(x, y, w, h, 10);
                fill(255);
                noStroke();
                textSize(20);
                textAlign(CENTER, CENTER);
                text(label, x + w / 2, y + h / 2);
            }

            function mousePressed() {
                if (scene === 0) {
                    let btnX = width - 250;
                    let btnY = height - 80;
                    let btnW = 200;
                    let btnH = 50;
                    if (mouseX > btnX && mouseX < btnX + btnW && mouseY > btnY && mouseY < btnY + btnH) {
                        scene = 1;
                        startTime = millis();
                    }
                }
            }

            function drawBackground(x, y, size) { //침실배경 그림
                push();
                translate(x, y);
                scale(size);
                fill(150, 250, 70);
                noStroke();
                fill(120, 60, 30);
                rect(300, 70, 150, 120, 10);
                fill(0);
                rect(305, 75, 140, 110, 8);
                fill(255, 255, 200);
                ellipse(405, 120, 60, 60);
                fill(10, 10, 30);
                ellipse(415, 120, 60, 60);
                stroke(140, 110, 80);
                strokeWeight(2);
                line(374, 73, 374, 185);
                line(303, 130, 445, 130);
                stroke(20);

                fill(120, 60, 30);
                rect(100, 250, 300, 80, 10);
                fill(230, 200, 200);
                rect(110, 240, 280, 50, 10);
                fill(255, 240, 240);
                rect(320, 230, 70, 30, 10);
                fill(200, 100, 150);
                rect(110, 280, 280, 40, 10);

                fill(100, 50, 20);
                rect(20, 270, 60, 60, 8);
                fill(255, 255, 150);
                ellipse(50, 260, 30, 30);
                pop();
            }

            function drawClock(x, y, diameter) {
                push();
                translate(x, y);
                stroke(0);
                strokeWeight(4);
                fill(255);
                ellipse(0, 0, diameter);

                fill(0);
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(diameter * 0.08);
                let r = diameter * 0.4;
                for (let i = 1; i <= 12; i++) {
                    let angle = radians(i * 30 - 90);
                    let tx = cos(angle) * r;
                    let ty = sin(angle) * r;
                    text(i, tx, ty);
                }

                let hourAngle = radians(60 - 90);
                stroke(0, 0, 255);
                strokeWeight(diameter * 0.035);
                line(0, 0, cos(hourAngle) * diameter * 0.25, sin(hourAngle) * diameter * 0.25);

                let minuteAngle = radians(0 - 90);
                stroke(0);
                strokeWeight(diameter * 0.02);
                line(0, 0, cos(minuteAngle) * diameter * 0.35, sin(minuteAngle) * diameter * 0.35);

                let s = second();
                let secondAngle = radians(s * 6 - 90);
                stroke(255, 0, 0);
                strokeWeight(diameter * 0.01);
                line(0, 0, cos(secondAngle) * diameter * 0.45, sin(secondAngle) * diameter * 0.45);

                fill(0);
                noStroke();
                ellipse(0, 0, diameter * 0.03);
                pop();
            }

            function drawFloor() {
                stroke(160, 210, 180);
                strokeWeight(1);
                for (let j = 0; j < height; j += 80) {
                    line(0, j, width, j);
                }
            }

            function drawScale(x, y, scaleSize, showLeft, showRight, weight) {
                let w = 200 * scaleSize;
                let h = 180 * scaleSize;
                let r = 20 * scaleSize;
                let displayW = 100 * scaleSize;
                let displayH = 40 * scaleSize;

                fill(180);
                stroke(40);
                strokeWeight(5);
                rect(x, y, w, h, r);

                fill(30);
                rect(x + w / 2 - displayW / 2, y + 20 * scaleSize, displayW, displayH, 5 * scaleSize);

                fill(0, 255, 0);
                textAlign(CENTER, CENTER);
                textSize(20 * scaleSize);
                text(weight.toFixed(1) + " kg", x + w / 2, y + 20 * scaleSize + displayH / 2);

                if (showLeft) {
                    image(img1, windowWidth * 3 / 11, windowHeight * 2 / 5, 400, 400);
                }
                if (showRight) {
                    image(img2, windowWidth * 5 / 9, windowHeight * 2 / 5, 400, 400);
                }
            }

            function drawSubtitle(textContent) {
                fill(255);
                textAlign(CENTER, CENTER);
                textSize(50);
                text(textContent, width / 2, height - 40);
            }

            function skipToNextScene() {
                let btn = createButton('다음 장면으로 넘어가려면 클릭하세요'); // 버튼 생성
                btn.position(width - 320, height - 80);
                btn.id('btn');

                btn.mousePressed(() => {
                    location.href = ("/p5js/asset/html/scene2.html");
                    btn.hide();
                });
            }
        </script>
    </div>
</body>

</html>
